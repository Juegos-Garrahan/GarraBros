<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memotest Hospitalario</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(#e3f2fd,#ffffff);
    text-align:center;
}

h1{
    color:#0078d7;
}

#homeButton{
    position:fixed;
    top:10px;
    right:10px;
    z-index:999;
    background:#1976d2;
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

#homeButton:hover{
    background:#125ca1;
}

#players{
    display:flex;
    justify-content:center;
    gap:40px;
    margin:20px;
    flex-wrap:wrap;
}

.player{
    background:white;
    padding:10px 20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    font-size:22px;
}

.active{
    background:#ffe082;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    vertical-align:middle;
}

#message{
    width:90%;
    max-width:900px;
    margin:15px auto;
    padding:15px;
    background:white;
    border-radius:10px;
    min-height:60px;
    font-size:20px;
}

#board{
    width:800px;
    max-width:95%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.card{
    height:140px;
    border-radius:12px;
    cursor:pointer;
    background:#2196f3;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    color:white;
    transition:.3s;
}

.card.flipped{
    background:white;
    color:black;
    border:3px solid #4caf50;
}

.card.matched{
    background:#c8f7c5;
    cursor:default;
}

.card img{
    width:100px;
    height:100px;
    object-fit:contain;
}

#winner{
    display:none;
    margin-top:30px;
}

#winner h2{
    color:#2e7d32;
    font-size:36px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#28a745;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

</style>
</head>
<body>

<a href="index.html" id="homeButton">
🏠 Menú Principal
</a>

<h1>🏥 Memotest de los Héroes de la Salud</h1>

<div id="players">

<div class="player active" id="p1">
<span id="avatar1"></span>
Tomi:
<span id="score1">0</span>
</div>

<div class="player" id="p2">
<span id="avatar2"></span>
Luna:
<span id="score2">0</span>
</div>

</div>

<div id="message">
👀 Memoriza las cartas.
</div>

<div id="board"></div>

<div id="winner">
    <h2 id="winnerText"></h2>

    <button onclick="location.reload()">
        Jugar otra vez
    </button>
</div>

<script>

/******************************************
 CONFIGURACIÓN DE JUGADORES
******************************************/

const player1Emoji="🧒";
const player2Emoji="👧";

const player1Image="images/personaje_m.png";
const player2Image="images/personaje_f.png";

/******************************************
 CARTAS
 Si image está vacío usa el emoji
******************************************/

const cardsData=[

{
icon:"👩‍⚕️",
image:"",
text:"La doctora ayuda a que los niños estén sanos."
},

{
icon:"👩‍⚕️",
image:"",
text:"La doctora ayuda a que los niños estén sanos."
},

{
icon:"👩‍⚕️💙",
image:"images/logo_garrahan.png",
text:"Las enfermeras cuidan a los niños todos los días."
},

{
icon:"👩‍⚕️💙",
image:"images/logo_garrahan.png",
text:"Las enfermeras cuidan a los niños todos los días."
},

{
icon:"🧑‍🔬",
image:"",
text:"Los análisis ayudan a conocer mejor tu salud."
},

{
icon:"🧑‍🔬",
image:"",
text:"Los análisis ayudan a conocer mejor tu salud."
},

{
icon:"🩺",
image:"",
text:"Escuchar el corazón ayuda a revisar tu salud."
},

{
icon:"🩺",
image:"",
text:"Escuchar el corazón ayuda a revisar tu salud."
},

{
icon:"🩹",
image:"",
text:"Las curitas ayudan a sanar."
},

{
icon:"🩹",
image:"",
text:"Las curitas ayudan a sanar."
},

{
icon:"❤️",
image:"",
text:"Un corazón sano es una gran noticia."
},

{
icon:"❤️",
image:"",
text:"Un corazón sano es una gran noticia."
},

{
icon:"🏥",
image:"images/hospital.png",
text:"El hospital es un lugar para ayudarte."
},

{
icon:"🏥",
image:"images/hospital.png",
text:"El hospital es un lugar para ayudarte."
},

{
icon:"😊",
image:"",
text:"Ser valiente es cuidar tu salud."
},

{
icon:"😊",
image:"",
text:"Ser valiente es cuidar tu salud."
}

];

/******************************************
 AVATARES
******************************************/

document.getElementById("avatar1").innerHTML =
`<img src="${player1Image}"
      class="avatar"
      onerror="this.outerHTML='${player1Emoji}'">`;

document.getElementById("avatar2").innerHTML =
`<img src="${player2Image}"
      class="avatar"
      onerror="this.outerHTML='${player2Emoji}'">`;

/******************************************
 MEZCLAR CARTAS
******************************************/

cardsData.sort(()=>Math.random()-0.5);

const board=document.getElementById("board");

let firstCard=null;
let secondCard=null;
let lock=true;

let currentPlayer=1;
let score1=0;
let score2=0;

cardsData.forEach(cardData=>{

let card=document.createElement("div");

card.className="card flipped";

card.dataset.icon=cardData.icon;
card.dataset.image=cardData.image;
card.dataset.text=cardData.text;

if(cardData.image){
    card.innerHTML=`<img src="${cardData.image}">`;
}
else{
    card.innerHTML=cardData.icon;
}

card.addEventListener("click",flipCard);

board.appendChild(card);

});

/******************************************
 CUENTA REGRESIVA
******************************************/

let seconds=5;

const interval=setInterval(()=>{

document.getElementById("message").innerHTML=
`👀 Memoriza las cartas. Se ocultarán en ${seconds} segundos...`;

seconds--;

if(seconds<0){

clearInterval(interval);

document.querySelectorAll(".card").forEach(card=>{

card.classList.remove("flipped");
card.innerHTML="❓";

});

document.getElementById("message").innerHTML=
"🎮 Comienza Tomi.";

lock=false;

}

},1000);

/******************************************
 JUEGO
******************************************/

function reveal(card){

if(card.dataset.image){

card.innerHTML=
`<img src="${card.dataset.image}">`;

}
else{

card.innerHTML=card.dataset.icon;

}

}

function flipCard(){

if(lock) return;

if(this.classList.contains("matched")) return;

if(this===firstCard) return;

this.classList.add("flipped");

reveal(this);

if(!firstCard){

firstCard=this;
return;

}

secondCard=this;
lock=true;

if(
firstCard.dataset.icon===secondCard.dataset.icon &&
firstCard.dataset.image===secondCard.dataset.image
){

setTimeout(()=>{

firstCard.classList.add("matched");
secondCard.classList.add("matched");

document.getElementById("message").innerHTML=
"✅ "+firstCard.dataset.text;

if(currentPlayer===1){

score1++;
document.getElementById("score1").textContent=score1;

}else{

score2++;
document.getElementById("score2").textContent=score2;

}

resetCards();

if(document.querySelectorAll(".matched").length===16){

finishGame();

}

},600);

}
else{

setTimeout(()=>{

firstCard.classList.remove("flipped");
secondCard.classList.remove("flipped");

firstCard.innerHTML="❓";
secondCard.innerHTML="❓";

changePlayer();

resetCards();

},1000);

}

}

function resetCards(){

firstCard=null;
secondCard=null;
lock=false;

}

function changePlayer(){

currentPlayer=currentPlayer===1?2:1;

document.getElementById("p1").classList.toggle("active");
document.getElementById("p2").classList.toggle("active");

document.getElementById("message").innerHTML=
currentPlayer===1
?
"🎮 Turno de Tomi"
:
"🎮 Turno de Luna";

}

function finishGame(){

    let text="";

    if(score1 > score2){
        text = "🏆 ¡Ganó Tomi!";
    }
    else if(score2 > score1){
        text = "🏆 ¡Ganó Luna!";
    }
    else{
        text = "🤝 ¡Empate!";
    }

    document.getElementById("winnerText").innerHTML = text;
    document.getElementById("winner").style.display = "block";

    lock = true;
}

</script>

</body>
</html>
